name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.110" "uvicorn>=0.23" "httpx>=0.27"

      - name: 跑测试
        run: python -m unittest discover -s tests -t .
        env:
          SIGNALWATCH_HOME: ${{ runner.temp }}/signalwatch-ci

      - name: 冒烟：CLI 能起
        run: python run.py stats
        env:
          SIGNALWATCH_HOME: ${{ runner.temp }}/signalwatch-ci

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 构建 wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: 装 wheel 验证
        run: |
          python -m pip install --no-deps dist/*.whl
          python -c "import signalwatch, pathlib; print(signalwatch.__version__); print(sorted(p.name for p in (pathlib.Path(signalwatch.__file__).parent / 'web').iterdir()))"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: docker build -t signalwatch:ci .
      - name: 容器里跑一次 CLI
        run: docker run --rm -e SIGNALWATCH_HOME=/data signalwatch:ci signalwatch stats
      - name: compose 配置校验
        run: docker compose config
