<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>signalwatch · 管理台</title>
<link rel="stylesheet" href="/admin.css" />
</head>
<body>
<header>
  <h1>signalwatch 管理台</h1>
  <span class="badge" id="who">未登录</span>
  <span class="badge on" id="ver">v?</span>
  <span class="flex1"></span>
  <a class="muted" href="/">← 时间线</a>
  <button class="ghost hide" id="mypwd">改口令</button>
  <button class="ghost hide" id="logout">退出</button>
</header>

<div id="login" class="card">
  <h2>登录</h2>
  <div class="row col-stretch">
    <input id="u" placeholder="用户名" value="admin" autocomplete="username" />
    <input id="p" type="password" placeholder="口令" autocomplete="current-password" />
    <button id="go">登录</button>
    <div class="err" id="lerr"></div>
    <div class="muted fs12">首次启动会建一个 admin / admin123，进去后第一件事是改口令。</div>
  </div>
</div>

<div id="app" class="wrap hide">
  <div class="tabs">
    <div class="tab on" data-t="overview">概览</div>
    <div class="tab" data-t="items">条目</div>
    <div class="tab" data-t="categories">分类</div>
    <div class="tab" data-t="jobs">任务</div>
    <div class="tab" data-t="report">报表</div>
    <div class="tab" data-t="users">用户</div>
    <div class="tab" data-t="sources">数据源</div>
    <div class="tab" data-t="rules">订阅词</div>
    <div class="tab" data-t="settings">设置</div>
    <div class="tab" data-t="audit">审计</div>
    <div class="tab" data-t="me">我的</div>
  </div>

  <div id="t-overview" class="card">
    <h2>近 7 天</h2>
    <div class="kpi" id="kpi"></div>
    <table id="daily" class="mt14"></table>
  </div>

  <div id="t-users" class="card hide">
    <h2>用户</h2>
    <div class="row mb10">
      <input id="nu" placeholder="新用户名" />
      <input id="np" type="password" placeholder="口令（≥6）" />
      <select id="nr"><option value="viewer">viewer 只读</option><option value="analyst">analyst 可操作</option><option value="admin">admin 管理</option></select>
      <button id="adduser">加用户</button>
      <span class="err" id="uerr"></span>
    </div>
    <table id="users"></table>
  </div>

  <div id="t-sources" class="card hide">
    <h2>数据源</h2>
    <table id="sources"></table>
  </div>

  <div id="t-rules" class="card hide">
    <h2>订阅词</h2>
    <p class="muted">标题里出现这些词的条目会被标黄；只提醒订阅词的开关在「设置」。</p>
    <div class="row mb12">
      <input id="r_kw" placeholder="关键词，例如：中标 / 增持 / 回购" class="w260">
      <input id="r_cat" placeholder="分类（可不填）" class="w150">
      <input id="r_src" placeholder="来源（可不填）" class="w150">
      <button id="r_add">添加</button>
      <span class="err" id="r_err"></span>
    </div>
    <table id="rules" class="grid w100">
      <thead><tr><th class="w70">ID</th><th>关键词</th><th class="w110">分类</th>
      <th class="w110">来源</th><th class="w80">状态</th><th class="w190">操作</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="t-me" class="card hide">
    <h2>我的</h2>
    <table class="grid w100">
      <tbody>
        <tr><th class="w140">账号</th><td id="me_name">—</td></tr>
        <tr><th>角色</th><td id="me_role">—</td></tr>
        <tr><th>上次登录</th><td id="me_last">—</td></tr>
        <tr><th>我建的订阅词</th><td id="me_rules">—</td></tr>
      </tbody>
    </table>
    <h2 class="mt22">改口令</h2>
    <div class="row">
      <input id="me_old" type="password" placeholder="原口令" class="w200">
      <input id="me_new" type="password" placeholder="新口令（≥6 位）" class="w240">
      <button id="me_save">保存</button>
      <span class="err" id="me_err"></span>
    </div>
  </div>

  <div id="t-audit" class="card hide">
    <h2>操作审计（最近的在上）</h2>
    <div class="row mb10">
      <button id="aexp" class="ghost">导出 CSV</button>
      <button id="aprune" class="danger">清理 90 天前</button>
      <span class="err" id="aerr"></span>
    </div>
    <table id="audit"></table>
  </div>

  <div id="t-items" class="card hide">
    <h2>条目 <span class="muted" id="ipage"></span></h2>
    <div class="row mb10">
      <input id="iq" placeholder="标题 / 公司 / 代码" />
      <button id="isearch">搜</button>
      <button id="ion" class="ghost">上架</button>
      <button id="ioff" class="ghost">下架</button>
      <button id="idel" class="ghost">删除</button>
      <a class="btn-ghost" id="icsv" href="/api/admin/items.csv" target="_blank">导出</a>
      <span class="err" id="ierr"></span>
    </div>
    <table id="items"></table>
    <div class="row mt10">
      <button id="iprev" class="ghost">上一页</button>
      <button id="inext" class="ghost">下一页</button>
    </div>
  </div>

  <div id="t-categories" class="card hide">
    <h2>分类</h2>
    <div class="row mb10">
      <input id="nc" placeholder="新分类名" />
      <button id="addcat">新增</button>
      <span class="err" id="cerr"></span>
    </div>
    <table id="cats"></table>
  </div>

  <div id="t-jobs" class="card hide">
    <h2>抓取任务 <span class="muted" id="jcounts"></span></h2>
    <div class="row mb10">
      <button id="jall">全部抓一轮</button>
      <button class="ghost jone" data-s="cninfo">cninfo</button>
      <button class="ghost jone" data-s="ithome">ithome</button>
      <button class="ghost jone" data-s="sspai">sspai</button>
      <button class="ghost jone" data-s="arxiv">arxiv</button>
      <button id="jrefresh" class="ghost">刷新</button>
      <span class="err" id="jerr"></span>
    </div>
    <table id="jobs"></table>
  </div>

  <div id="t-report" class="card hide">
    <h2>报表</h2>
    <div class="row mb10">
      <select id="rdays"><option value="1">近 1 天</option><option value="7" selected>近 7 天</option><option value="30">近 30 天</option></select>
      <button id="rload">刷新</button>
    </div>
    <table id="rsource"></table>
    <h2 class="mt16">公司 Top 10</h2>
    <table id="rtop"></table>
  </div>

  <div id="t-settings" class="card hide">
    <h2>设置</h2>
    <div id="setform"></div>
    <button id="savset" class="mt10">保存</button>
    <span class="err" id="serr"></span>

    <h2 class="mt22">推送（邮件）</h2>
    <div id="ntfstate" class="muted mb10">读取中…</div>
    <div class="row">
      <input id="n_host" placeholder="smtp.qq.com" class="w180">
      <input id="n_port" placeholder="465" class="w80">
      <input id="n_user" placeholder="发件邮箱" class="w220">
      <input id="n_pwd" type="password" placeholder="授权码" class="w200">
    </div>
    <div class="row mt8">
      <input id="n_to" placeholder="收件邮箱（默认为发件人自己）" class="w280">
      <label class="chk"><input id="n_enabled" type="checkbox"> 有新条目时自动发摘要</label>
      <button id="nsave" class="ghost">保存</button>
      <button id="ntest">保存并发测试邮件</button>
    </div>
  </div>
</div>

<script src="/admin.js" defer></script>
</body>
</html>
