<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>signalwatch · 盯梢机器</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0b0d10" />
<style>
  :root{
    --bg:#0b0d10; --panel:#12151a; --line:#232833; --text:#e8ecf2; --dim:#98a2b3;
    --accent:#4f8cff; --good:#38d39f; --warn:#ffb454; --bad:#ff5f6d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);
         position:sticky;top:0;background:rgba(11,13,16,.92);backdrop-filter:blur(8px);z-index:5}
  header h1{font-size:15px;margin:0;letter-spacing:.3px}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .badge.ok{color:var(--good);border-color:#1f4d3c}
  .badge.bad{color:var(--bad);border-color:#4d1f25}
  .spacer{flex:1}
  #degraded{display:none;margin:0;padding:9px 18px;background:#3a1c20;color:#ffd7db;
            border-bottom:1px solid #5a2a30;font-size:13px}
  main{max-width:900px;margin:0 auto;padding:16px 18px 60px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input[type=search]{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);
       color:var(--text);border-radius:9px;padding:9px 12px;font-size:14px}
  input[type=search]:focus{outline:none;border-color:var(--accent)}
  button{background:var(--panel);border:1px solid var(--line);color:var(--text);
         border-radius:9px;padding:8px 12px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.on{background:#17233d;border-color:var(--accent);color:#cfe0ff}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .stats{display:flex;gap:18px;color:var(--dim);font-size:12px;margin:6px 0 16px}
  .stats b{color:var(--text);font-weight:600}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:10px}
  .item.rev{border-color:#5a4a1f;background:#1b1710}
  .item .top{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--dim);margin-bottom:6px}
  .src{font-family:ui-monospace,Consolas,monospace;color:#9fb4d8}
  .rev-tag{color:var(--warn);font-size:11px;border:1px solid #5a4a1f;border-radius:999px;padding:1px 7px}
  .item a{color:var(--text);text-decoration:none}
  .item a:hover{color:var(--accent)}
  .item .title{font-size:14.5px;line-height:1.5}
  .item .sum{color:var(--dim);font-size:13px;margin-top:6px}
  .item button.more{margin-top:8px;padding:3px 9px;font-size:12px;border-radius:8px;
                    background:transparent;border:1px solid var(--line);color:var(--dim);cursor:pointer}
  .item button.more:hover{color:#7ea6ff;border-color:#2c4a86}
  .item .body{margin-top:8px;font-size:13px;line-height:1.65;color:#c8d2de;
              white-space:pre-wrap;max-height:340px;overflow:auto}
  .sec{font-size:12px;color:#8fb3ff;margin-right:6px}
  .empty{color:var(--dim);text-align:center;padding:60px 0}
  .foot{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;
        padding:10px;background:rgba(11,13,16,.94);border-top:1px solid var(--line)}
  body{padding-bottom:56px}
</style>
</head>
<body>
<header>
  <h1>signalwatch</h1>
  <span class="badge" id="status">空闲</span>
  <span class="badge" id="ver">v?</span>
  <span class="spacer"></span>
  <button id="refresh">刷新</button>
</header>
<p id="degraded"></p>
<main>
  <div class="bar">
    <input id="q" type="search" placeholder="搜标题 / 公司 / 摘要（输入即过滤）" />
    <button id="crawl">立刻抓一轮</button>
  </div>
  <div class="chips" id="chips">
    <button class="src-chip on" data-src="">全部</button>
  </div>
  <div class="stats">
    <span>条目 <b id="n-items">0</b></span>
    <span>今日新增 <b id="n-today">0</b></span>
    <span>被修订 <b id="n-rev">0</b></span>
    <span id="last-run">—</span>
  </div>
  <div id="list"><div class="empty">还没有数据。等第一轮抓完，或点「立刻抓一轮」。</div></div>
</main>
<div class="foot"><span style="color:var(--dim);font-size:12px">本地运行 · 只读公开来源 · 每分钟自动刷新</span></div>

<script>
const $ = (id) => document.getElementById(id);
let state = { src: "", q: "", items: [] };
const fmt = (ms) => {
  if (!ms) return "—";
  const d = new Date(ms), now = Date.now();
  const diff = (now - ms) / 1000;
  const p = (n) => String(n).padStart(2, "0");
  const t = `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  if (diff < 60) return "刚刚";
  if (diff < 3600) return `${Math.floor(diff/60)} 分钟前`;
  if (diff < 86400) return `${Math.floor(diff/3600)} 小时前 · ${t}`;
  return t;
};
const esc = (s) => (s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function loadMeta(){
  try{
    const h = await (await fetch("/api/health")).json();
    $("ver").textContent = "v" + h.version;
  }catch(e){}
  try{
    const r = await fetch("/api/sources"); const j = await r.json();
    const bad = j.sources.filter(s => s.status !== "ok");
    $("degraded").style.display = bad.length ? "block" : "none";
    if (bad.length) $("degraded").textContent =
      "源异常：" + bad.map(s => `${s.name}（连续失败 ${s.fail_count} 次：${s.last_error||"?"}）`).join("；");
    const chips = j.sources.map(s => `<button class="src-chip ${state.src===s.name?'on':''}" data-src="${s.name}">${s.name}${s.status!=="ok"?" !":""}</button>`).join("");
    $("chips").innerHTML = `<button class="src-chip ${state.src===''?'on':''}" data-src="">全部</button>` + chips;
    bindChips();
    const last = j.runs[0];
    $("last-run").textContent = last ? `上次 ${last.source} · ${fmt(last.started_at)} · ${last.ok?"成功":"失败"}` : "还没跑过";
  }catch(e){}
}
async function loadItems(){
  const u = new URL("/api/items", location.origin);
  u.searchParams.set("limit", "100");
  if (state.src) u.searchParams.set("source", state.src);
  if (state.q) u.searchParams.set("q", state.q);
  const r = await fetch(u); const j = await r.json();
  state.items = j.items;
  $("list").innerHTML = j.items.length ? j.items.map(it => `
    <div class="item ${it.version>1?'rev':''}">
      <div class="top">
        <span class="src">${esc(it.source)}</span>
        <span>${fmt(it.published_at)}</span>
        ${it.version>1?`<span class="rev-tag">已修订 v${it.version}</span>`:""}
        <span class="spacer" style="flex:1"></span>
        <span>${esc(it.kind)}</span>
      </div>
      <div class="title">
        ${it.sec_code?`<span class="sec">${esc(it.sec_code)} ${esc(it.sec_name||"")}</span>`:""}
        ${it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`:esc(it.title)}
      </div>
      ${it.summary?`<div class="sum">${esc(it.summary.slice(0,160))}</div>`:""}
      ${it.body_chars?`<button class="more" data-text="${it.id}">看正文（${it.body_chars} 字）</button>`:""}
      <div class="body" id="body-${it.id}"></div>
    </div>`).join("") : `<div class="empty">没有匹配的条目。</div>`;
  document.querySelectorAll("button.more").forEach(b => {
    b.onclick = async () => {
      const box = document.getElementById("body-" + b.dataset.text);
      if (box.dataset.open === "1") { box.dataset.open = "0"; box.textContent = ""; return; }
      box.dataset.open = "1";
      box.textContent = "正在取…";
      try {
        const r = await fetch(`/api/items/${b.dataset.text}/text`);
        const j = await r.json();
        box.textContent = j.text || "（这条没抠到正文）";
      } catch (e) { box.textContent = "取正文失败：" + e; }
    };
  });
}
async function loadStats(){
  try{ const j = await (await fetch("/api/stats")).json();
    $("n-items").textContent = j.items; $("n-today").textContent = j.today; $("n-rev").textContent = j.revised;
    $("status").textContent = "运行中"; $("status").className = "badge ok";
  }catch(e){ $("status").textContent = "服务未响应"; $("status").className = "badge bad"; }
}
function bindChips(){
  document.querySelectorAll(".src-chip").forEach(b => b.onclick = () => {
    state.src = b.dataset.src; document.querySelectorAll(".src-chip").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); loadItems();
  });
}
let timer;
$("q").oninput = (e) => { clearTimeout(timer); timer = setTimeout(()=>{ state.q = e.target.value.trim(); loadItems(); }, 220); };
$("refresh").onclick = () => { loadMeta(); loadItems(); loadStats(); };
$("crawl").onclick = async () => {
  $("crawl").textContent = "抓取中…";
  await fetch("/api/crawl", {method:"POST"});
  setTimeout(()=>{ $("crawl").textContent = "立刻抓一轮"; loadMeta(); loadItems(); loadStats(); }, 4000);
};
(async function init(){
  loadMeta(); loadItems(); loadStats();
  setInterval(()=>{ loadMeta(); loadItems(); loadStats(); }, 60000);

// 服务端推计数：有新条目立刻刷，不用等那 60 秒
let lastTotal = null;
function live(){
  try{
    const es = new EventSource("/api/events/stats");
    es.onmessage = (ev) => {
      let s; try { s = JSON.parse(ev.data); } catch(e){ return; }
      if (lastTotal !== null && s.items > lastTotal) { loadItems(); loadStats(); }
      lastTotal = s.items;
    };
    es.onerror = () => { es.close(); setTimeout(live, 5000); };
  }catch(e){}
}
live();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
})();
</script>
</body>
</html>
