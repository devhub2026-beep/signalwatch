<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>signalwatch · 盯梢机器</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0b0d10" />
<link rel="stylesheet" href="/index.css" />
</head>
<body>
<header>
  <h1>signalwatch</h1>
  <span class="badge" id="status">空闲</span>
  <span class="badge" id="ver">v?</span>
  <span class="spacer"></span>
  <button id="refresh">刷新</button>
  <a id="adminlink" href="/admin">管理台</a>
</header>
<p id="degraded"></p>
<main>
  <div class="bar">
    <input id="q" type="search" placeholder="搜标题 / 公司 / 摘要（输入即过滤）" />
    <button id="crawl">立刻抓一轮</button>
  </div>
  <div class="chips" id="chips">
    <button class="src-chip on" data-src="">全部</button>
  </div>
  <div class="stats">
    <span>条目 <b id="n-items">0</b></span>
    <span>今日新增 <b id="n-today">0</b></span>
    <span>被修订 <b id="n-rev">0</b></span>
    <span id="last-run">—</span>
  </div>
  <div id="list"><div class="empty">还没有数据。等第一轮抓完，或点「立刻抓一轮」。</div></div>
</main>
<div class="foot"><span class="foot-note">本地运行 · 只读公开来源 · 每分钟自动刷新</span></div>

<script src="/index.js" defer></script>
</body>
</html>
